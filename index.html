<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企业制度智能问答</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
:root{--brand:#475569;--brand-hover:#334155;--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--input-bg:#f1f5f9}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
input,button{font-family:inherit}
.fld{background:var(--input-bg);border:2px solid transparent;border-radius:10px;padding:10px 14px;font-size:14px;width:100%;outline:none;color:var(--text);transition:all .2s}
.fld:focus{border-color:var(--brand);background:#fff}
.fld::placeholder{color:#94a3b8}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.btn:hover{background:var(--brand-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none;transform:none}
.btn-ghost{background:transparent;border:2px solid var(--border);color:var(--text);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.btn-ghost:hover{background:var(--input-bg)}
.msg-user{background:#334155;color:#fff;font-size:13px;letter-spacing:-.01em;border-radius:16px 16px 4px 16px}
.msg-ai{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 16px 4px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.markdown h2{font-size:1.1em;font-weight:700;margin:.5em 0 .2em;color:var(--brand)}
.markdown table{width:100%;border-collapse:collapse;margin:.3em 0;font-size:.88em}
.markdown th{background:var(--input-bg);font-weight:600;text-align:left;padding:6px 10px;border:1px solid var(--border)}
.markdown td{padding:6px 10px;border:1px solid var(--border)}
.markdown strong{color:var(--brand)}
.markdown p{margin:.3em 0}
.markdown ul,.markdown ol{padding-left:1.5em;margin:.3em 0}
.modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.35);backdrop-filter:blur(3px)}
.source-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:500;background:#f1f5f9;color:#475569;margin-right:4px}
</style>
</head>
<body style="display:flex;height:100vh">

<!-- SIDEBAR -->
<div style="width:260px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0">
  <div style="padding:14px 16px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;background:var(--brand);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px">Q</div>
    <div>
      <div style="font-weight:700;font-size:14px;color:var(--text)">制度问答</div>
      <div style="font-size:10px;color:var(--muted);font-weight:500">Company Q&A</div>
    </div>
  </div>

  <div style="flex:1;padding:16px;overflow-y:auto">
    <div style="display:flex;flex-direction:column;gap:8px">
      <button onclick="newChat()" class="btn" style="width:100%">新对话</button>
      <div id="convList" style="display:flex;flex-direction:column;gap:4px;margin-top:8px"></div>
    </div>

    <div style="margin-top:16px;padding:12px;background:var(--input-bg);border-radius:10px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px">知识库状态</div>
      <div id="kbStatus" style="font-size:11px;color:var(--text)">加载中...</div>
    </div>
  </div>

  <div style="padding:12px 16px;border-top:1px solid #e2e8f0;font-size:12px">
    <div id="loginBtn" onclick="showLogin()" style="color:var(--brand);cursor:pointer;font-weight:500">登入账号</div>
    <div id="userBox" style="display:none;align-items:center;gap:6px">
      <span id="uAv" style="width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700"></span>
      <span id="uNm" style="font-size:12px;font-weight:500"></span>
      <span onclick="logout()" style="color:var(--muted);cursor:pointer;margin-left:auto;font-size:10px">退出</span>
    </div>
  </div>
</div>

<!-- CHAT AREA -->
<div style="flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:0">
  <div id="chatBox" style="flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px">
    <div id="welcome" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)">
      <div style="font-size:48px;margin-bottom:12px;opacity:.6;filter:grayscale(1)">&#x1F4DA;</div>
      <h2 style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">企业制度智能问答</h2>
      <p style="font-size:13px;text-align:center;max-width:320px;line-height:1.6">上传制度文档后，用自然语言提问<br>比如：年假有几天？加班费怎么算？</p>
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <span onclick="quickAsk('年假有几天')" class="source-tag" style="cursor:pointer">年假</span>
        <span onclick="quickAsk('工资几号发')" class="source-tag" style="cursor:pointer">工资</span>
        <span onclick="quickAsk('请假流程')" class="source-tag" style="cursor:pointer">请假</span>
        <span onclick="quickAsk('五险一金怎么交')" class="source-tag" style="cursor:pointer">五险一金</span>
        <span onclick="quickAsk('加班费怎么算')" class="source-tag" style="cursor:pointer">加班</span>
        <span onclick="quickAsk('离职流程')" class="source-tag" style="cursor:pointer">离职</span>
      </div>
    </div>
  </div>
  <div style="padding:12px 20px;border-top:1px solid #e2e8f0;background:#fff;display:flex;gap:8px;align-items:center">
    <input id="chatInput" class="fld" placeholder="输入问题..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()" class="btn">提问</button>
  </div>
</div>

<!-- RIGHT: Source panel -->
<div id="sourcePanel" style="width:320px;border-left:1px solid #e2e8f0;background:#fff;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden">
  <div style="padding:14px 16px;border-bottom:1px solid #e2e8f0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">参考来源</div>
  <div id="sourceContent" style="flex:1;overflow-y:auto;padding:12px 16px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center">提问后将显示相关制度原文</div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeLogin()">
  <div style="background:#fff;border-radius:16px;padding:24px;width:360px" onclick="event.stopPropagation()">
    <div style="font-size:16px;font-weight:700;margin-bottom:12px" id="loginTitle">登入账号</div>
    <div style="display:flex;background:var(--input-bg);border-radius:8px;padding:2px;margin-bottom:12px">
      <button id="tabE" onclick="swT('email')" style="flex:1;padding:6px;font-size:12px;border-radius:6px;background:#fff;border:none;cursor:pointer;font-weight:500">邮箱</button>
      <button id="tabP" onclick="swT('phone')" style="flex:1;padding:6px;font-size:12px;border-radius:6px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-weight:500">手机</button>
    </div>
    <form onsubmit="doLogin(event)" style="display:flex;flex-direction:column;gap:8px">
      <div id="ef"><input id="lem" class="fld" placeholder="邮箱地址"></div>
      <div id="pf" style="display:none"><input id="lph" class="fld" placeholder="手机号"></div>
      <input id="lnm" class="fld" placeholder="用户名（注册时填写）">
      <input id="lpw" type="password" class="fld" placeholder="密码">
      <button type="submit" class="btn" style="width:100%">登入</button>
    </form>
    <div onclick="tgL()" id="tgLbl" style="text-align:center;margin-top:8px;font-size:11px;color:var(--muted);cursor:pointer">没有账号？去注册</div>
  </div>
</div>

<script>
var A="http://localhost:8000/api",tk=localStorage.getItem("t"),cid=null,isReg=false,lt="email";

function addBubble(role,text,sources){
  var el=document.getElementById("chatBox"),w=document.getElementById("welcome");if(w)w.style.display="none";
  var d=document.createElement("div");d.style.cssText="display:flex;"+(role==="user"?"justify-content:flex-end":"justify-content:flex-start");
  var html='<div style="max-width:80%;padding:10px 16px;font-size:13px;line-height:1.6;'+(role==="user"?"background:var(--brand);color:#fff;border-radius:16px 16px 4px 16px":"background:#fff;border:1px solid var(--border);border-radius:16px 16px 16px 4px")+'"><div class="markdown">'+(role==="assistant"?marked.parse(text):text)+'</div></div>';
  d.innerHTML=html;el.appendChild(d);el.scrollTop=el.scrollHeight;

  // Show sources in right panel
  if(sources&&sources.length){
    var sc=document.getElementById("sourceContent");
    sc.innerHTML='<div style="display:flex;flex-direction:column;gap:8px">';
    sources.forEach(function(s,i){
      sc.innerHTML+='<div style="padding:10px;background:var(--input-bg);border-radius:8px;font-size:11px;line-height:1.5"><div style="font-weight:600;color:var(--text);margin-bottom:2px">来源 '+(i+1)+'</div>'+s.substring(0,200)+(s.length>200?'...':'')+'</div>';
    });
    sc.innerHTML+='</div>';
  }
}

function quickAsk(q){document.getElementById("chatInput").value=q;send()}
function newChat(){cid=null;document.getElementById("chatBox").innerHTML='<div id="welcome" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px;opacity:.6;filter:grayscale(1)">&#x1F4DA;</div><h2 style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">企业制度智能问答</h2><p style="font-size:13px;text-align:center;max-width:320px;line-height:1.6">上传制度文档后，用自然语言提问</p></div>';document.getElementById("sourceContent").innerHTML='提问后将显示相关制度原文'}

async function send(){
  var msg=document.getElementById("chatInput").value.trim();if(!msg)return;if(!tk){showLogin();return}
  document.getElementById("chatInput").value="";addBubble("user",msg);
  try{
    var r=await fetch(A+"/chat/send",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tk},body:JSON.stringify({question:msg,conversation_id:cid})});var d=await r.json();
    if(d.code===200||d.answer){cid=d.conversation_id||cid;addBubble("assistant",d.answer||d.message,d.sources||d.data?.sources)}
    else addBubble("assistant",d.message||"请求失败")
  }catch(e){addBubble("assistant","无法连接服务器")}
}

// AUTH
if(tk)loadU();
function loadU(){fetch(A+"/auth/me",{headers:{Authorization:"Bearer "+tk}}).then(r=>r.json()).then(d=>{if(d.code===200){document.getElementById("loginBtn").style.display="none";document.getElementById("userBox").style.display="flex";document.getElementById("uNm").textContent=d.data.username;document.getElementById("uAv").textContent=d.data.username[0].toUpperCase()}}).catch(e=>{tk=null;localStorage.removeItem("t")})}
function showLogin(){document.getElementById("loginModal").style.display="flex"}
function closeLogin(){document.getElementById("loginModal").style.display="none"}
function swT(t){lt=t;document.getElementById("ef").style.display=t==="email"?"block":"none";document.getElementById("pf").style.display=t==="phone"?"block":"none";document.getElementById("tabE").style.cssText=t==="email"?"flex:1;padding:6px;font-size:12px;border-radius:6px;background:#fff;border:none;cursor:pointer;font-weight:500":"flex:1;padding:6px;font-size:12px;border-radius:6px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-weight:500";document.getElementById("tabP").style.cssText=t==="phone"?"flex:1;padding:6px;font-size:12px;border-radius:6px;background:#fff;border:none;cursor:pointer;font-weight:500":"flex:1;padding:6px;font-size:12px;border-radius:6px;background:transparent;border:none;cursor:pointer;color:var(--muted);font-weight:500"}
function tgL(){isReg=!isReg;document.getElementById("loginTitle").textContent=isReg?"创建账号":"登入账号";document.getElementById("tgLbl").textContent=isReg?"已有账号？去登入":"没有账号？去注册";document.getElementById("lnm").parentElement.style.display=isReg?"block":"none"}
function doLogin(e){e.preventDefault();var em=document.getElementById("lem").value,ph=document.getElementById("lph").value,nm=document.getElementById("lnm").value,pw=document.getElementById("lpw").value;if(isReg){fetch(A+"/auth/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:em||null,phone:ph||null,username:nm,password:pw})}).then(r=>r.json()).then(d=>{if(d.code===200){tk=d.data.access_token;localStorage.setItem("t",tk);closeLogin();loadU()}else alert(d.message)})}else{var ep=lt==="email"?"/auth/login/email":"/auth/login/phone";var body=lt==="email"?{email:em,password:pw}:{phone:ph,password:pw};fetch(A+ep,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json()).then(d=>{if(d.code===200){tk=d.data.access_token;localStorage.setItem("t",tk);closeLogin();loadU()}else alert(d.message)})}}
function logout(){tk=null;localStorage.removeItem("t");location.reload()}
</script>
</body>
</html>
